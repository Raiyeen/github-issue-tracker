<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issues Tracker | Home</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- tailwind + daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }

      .active {
        color: white;
        background-color: blue;
        border: none;
      }
    </style>
  </head>

  <body class="bg-[#F8FAFC]">
    <!-- navbar -->
    <header class="bg-base-100 shadow-sm">
      <div class="navbar w-11/12 mx-auto">
        <div class="flex-1">
          <div class="flex items-center">
            <div class="w-[50px]">
              <img src="./assets/github-logo.png" alt="" />
            </div>
            <div class="pl-2 text-[16px] font-bold">GitHub Issue Tracker</div>
          </div>
        </div>
        <div class="flex gap-2">
          <input id="input-search"
            type="text"
            placeholder="Search for issues"
            class="input input-bordered w-24 md:w-auto fa-icon-placeholder"
          />

          <div class="dropdown dropdown-end bg-red-200">
            <button class="btn btn-primary bg-[#4A00FF]">
              <i class="fa-solid fa-plus"></i> New Issues
            </button>

            <!-- hidden menu -->
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
            >
              <li>
                <a class="justify-between">
                  Profile
                  <span class="badge">New</span>
                </a>
              </li>
              <li><a>Settings</a></li>
              <li><a>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <!-- filter buttons -->
    <section class="mt-13">
      <div
        class="w-9/12 mx-auto p-5 rounded-sm shadow-sm bg-white space-x-[10px]"
      >
        <button
          id="all-issue-btn"
          class="issue-btn btn pl-10 pr-10 btn-outline border-[#cbd1d8] btn-sm text-[#64748B] active"
        >
          All
        </button>
        <button
          id="closed-issue-btn"
          class="issue-btn btn pl-10 pr-10 btn-outline border-[#cbd1d8] btn-sm text-[#64748B] active"
        >
          Closed
        </button>
        <button
          id="open-issue-btn"
          class="issue-btn btn pl-10 pr-10 btn-outline border-[#cbd1d8] btn-sm text-[#64748B] active"
        >
          Open
        </button>
      </div>
    </section>

    <!-- issue counter -->
    <section class="mt-13">
      <div
        class="flex justify-between w-9/12 mx-auto p-4 rounded-t-sm border-b border-[#cacbcd] bg-white"
      >
        <div class="all-issue-counter flex items-center">
          <div class="issue-logo rounded-full p-1 bg-[#ECE4FF]">
            <img src="./assets/Aperture.png" alt="" />
          </div>
          <div
            id=""
            class="issue-number-and-text text-[13px] font-semibold ml-2"
          >
            <h2 id="issue-counter">50 issues</h2>
            <p class="text-[#b3b4b5] font-normal">
              Track and Manage Your Project Issues
            </p>
          </div>
        </div>

        <div class="issue-color flex items-center gap-3">
          <div class="flex items-center">
            <span class="text-[5px]">
              <i class="fa-solid fa-circle"></i>
            </span>
            <span class="pl-1 font-normal"> open </span>
          </div>
          <div class="flex items-center">
            <span class="text-[5px]">
              <i class="fa-solid fa-circle"></i>
            </span>
            <span class="pl-1 font-normal"> close </span>
          </div>
        </div>
      </div>
    </section>

    <!-- issue card -->
    <section>
      <div class="w-9/12 mx-auto p-4 shadow-sm bg-[#F8FAFC]">
        <div
          id="issue-card-container"
          class="issue-card-container grid grid-cols-1 md:grid-cols-3 gap-3"
        >
          <!--single card  -->
        </div>
      </div>
    </section>

    <!-- modal -->

    <!-- You can open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_4.showModal()">open modal</button> -->
    <dialog id="my_modal_4" class="modal">
      <div class="modal-box w-6/12 max-w-5xl">
        <div id="issueDetailsContainer" class="w-full space-y-3">
          
        </div>

        <div class="modal-action">
          <form method="dialog">
            <!-- if there is a button, it will close the modal -->
            <button class="btn btn-primary btn-sm">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <!-- login js -->
    <!-- <script src="./scripts/login.js"></script> -->

    <!-- card js -->
    <script src="./scripts/card.js"></script>
  </body>
</html>
